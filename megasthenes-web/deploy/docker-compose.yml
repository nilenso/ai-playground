services:
  # Sandbox worker: isolated git clone + tool execution
  # Security: bwrap (filesystem/PID) + seccomp (network blocking) + gVisor (syscall)
  sandbox:
    build:
      context: ../megasthenes/sandbox  # Relative to ~/megasthenes-web/ on server
      dockerfile: Containerfile
    runtime: runsc  # gVisor required - handles bwrap namespace creation
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN  # For bwrap namespace creation inside gVisor
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp:rw,size=64m
    networks:
      - sandbox
    volumes:
      - ./sandbox-resolv.conf:/etc/resolv.conf:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      - PORT=8080
      - SANDBOX_SECRET=${SANDBOX_SECRET}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: ghcr.io/nilenso/megasthenes-web:latest
    container_name: megasthenes-web
    environment:
      - PORT=3000
      - VISUALIZER_PORT=3001
      - DATABASE_PATH=/app/data/megasthenes.db
      - SESSION_DIR=/app/data/sessions
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SANDBOX_URL=http://sandbox:8080
      - SANDBOX_SECRET=${SANDBOX_SECRET}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_ADMIN_SECRET=${PHOENIX_ADMIN_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
    volumes:
      - ./data:/app/data
    networks:
      - sandbox
      - web
      - phoenix
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # ── Phoenix (observability) ──────────────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:version-13.18.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"  # localhost only — access via SSH tunnel or Caddy
    environment:
      PHOENIX_ENABLE_AUTH: "True"
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD}
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: 60
      PHOENIX_SQL_DATABASE_URL: postgresql://postgres:${PHOENIX_PG_PASSWORD:-postgres}@phoenix-db:5432/phoenix
    networks:
      - phoenix
      - web
    depends_on:
      - phoenix-db

  phoenix-db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: phoenix
      POSTGRES_PASSWORD: ${PHOENIX_PG_PASSWORD:-postgres}
    volumes:
      - phoenix-data:/var/lib/postgresql
    networks:
      - phoenix

volumes:
  phoenix-data:

networks:
  sandbox:
    # Git clone needs outbound access. Tool execution is network-blocked via seccomp.
    # Security layers: bwrap (filesystem/PID), seccomp (network), gVisor (syscall).
  web:
    external: true
  phoenix:
