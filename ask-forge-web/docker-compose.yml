services:
  migrate:
    image: ghcr.io/neenaoffline/litem8
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
      - ./data:/data
    command: up --db /data/ask-forge.db --migrations /migrations

  # ── Phoenix (observability) ──────────────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:version-13.18.0
    restart: unless-stopped
    ports:
      - "6006:6006"   # Web UI + OTLP HTTP collector
      - "4317:4317"   # gRPC OTLP collector
    volumes:
      - ./phoenix-data:/data
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_ENABLE_AUTH: "True"
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD}
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: 60
