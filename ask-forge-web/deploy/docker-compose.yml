services:
  sandbox:
    build:
      context: ../../ask-forge/sandbox
      dockerfile: Containerfile
    runtime: runsc
    tmpfs:
      - /tmp:rw,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    networks:
      - sandbox
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: ghcr.io/nilenso/ask-forge-web:latest
    container_name: ask-forge-web
    environment:
      - PORT=3000
      - VISUALIZER_PORT=3001
      - DATABASE_PATH=/app/data/ask-forge.db
      - SESSION_DIR=/app/data/sessions
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SANDBOX_URL=http://sandbox:8080
    volumes:
      - ./data:/app/data
    networks:
      - sandbox
      - web
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

networks:
  sandbox:
    # Sandbox needs outbound access for git clone.
    # Isolation is enforced by: runsc (gVisor), cap_drop ALL,
    # no-new-privileges, and non-root user.
  web:
    external: true
