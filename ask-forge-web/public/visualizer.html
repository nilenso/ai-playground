<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Session Visualizer</title>
	<style>
		*, *::before, *::after {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 0;
			background: #f5f5f5;
		}
		/* Markdown content styles */
		.markdown-content p {
			margin: 0 0 12px 0;
		}
		.markdown-content p:last-child {
			margin-bottom: 0;
		}
		.markdown-content ul, .markdown-content ol {
			margin: 0 0 12px 0;
			padding-left: 24px;
		}
		.markdown-content ul:last-child, .markdown-content ol:last-child {
			margin-bottom: 0;
		}
		.markdown-content li {
			margin-bottom: 4px;
		}
		.markdown-content h1, .markdown-content h2, .markdown-content h3 {
			margin: 16px 0 8px 0;
			color: #111827;
		}
		.markdown-content h1:first-child, .markdown-content h2:first-child, .markdown-content h3:first-child {
			margin-top: 0;
		}
		.markdown-content code {
			background-color: #e5e7eb;
			padding: 2px 6px;
			border-radius: 4px;
			font-size: 13px;
			font-family: ui-monospace, monospace;
		}
		.markdown-content pre {
			background-color: #1f2937;
			color: #f3f4f6;
			padding: 12px 16px;
			border-radius: 6px;
			overflow-x: auto;
			margin: 12px 0;
		}
		.markdown-content pre code {
			background: none;
			padding: 0;
			color: inherit;
		}
	</style>
</head>
<body>
	<div id="root"></div>
	<script type="module" src="/visualizer.js"></script>
</body>
</html>
