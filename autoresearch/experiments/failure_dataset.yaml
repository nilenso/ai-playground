# Failure dataset — the eval questions that walk into a known CLI defect, in
# questions.yaml format so it can be run as a bank on its own.
#
# Every question record below is copied verbatim from questions.yaml, with one
# block added:
#   failures[]             the known defects this question hits
#     id                   stable slug for the defect
#     proposal             1-based position in proposals.json
#     target               cli | skill | hint | docs (from proposals.json)
#     evidence             recorded = artifacts/findings.md or
#                            artifacts/history/report-5.md names this question id
#                            against this defect — a real trace exists
#                          matched  = this question's own `notes` describe the
#                            defect exactly, but no run trace was written down
#     title                the proposal's one-line summary, for reading offline
#
# Sources: proposals.json (20 defects), questions.yaml (30 questions),
# artifacts/findings.md (the Phase 1 probe behind proposals.json), and
# artifacts/history/report-5.md (the live 60-run eval behind proposals 15-17).
#
# 26 of the 30 questions are here. The four left out:
#   nearest-pois-harvard, tall-buildings-cambridge, brooklyn-every-building
#     clean paths — `at`, `--where 'height>100'` and `count -t building` all
#     behave as documented, so there is nothing for them to hit.
#   ev-charging-gap
#     has a recorded failure (report-5.md: two unnecessary `download -t division`
#     calls, with no steering tip because TYPE_TO_VERB has no `division` entry)
#     but no matching entry in proposals.json. That gap is in the proposal list,
#     not in this mapping.
#
# Nothing in the loop reads this file; like proposals.json it is a scorecard.

# ---------------------------------------------------------------------------
# Tier 1 — one verb, one answer.
# ---------------------------------------------------------------------------

- id: hospitals-rhode-island
  question: "How many hospitals are there in Rhode Island?"
  tier: 1
  download_is_legitimate: false
  target_type: place
  place: "Rhode Island, US"
  notes: "Ideal: count -t place --in 'Rhode Island, US' --where categories.primary=hospital. `count` has no --category flag."
  failures:
    - id: flag-coverage-gaps
      proposal: 8
      target: cli
      evidence: matched
      title: "Close the flag-coverage gaps that make reasonable commands fail"

- id: bbox-cambridge
  question: "What area does Cambridge, Massachusetts cover?"
  tier: 1
  download_is_legitimate: false
  target_type: division
  place: "Cambridge, MA"
  notes: "Ideal: where 'Cambridge, MA' (--json for the bbox). Not boundary / --geometry — those take ~20 min."
  failures:
    - id: division-geometry-latency
      proposal: 1
      target: cli
      evidence: matched
      title: "Emit progress and a timeout on the division-geometry verbs, which look hung for 10-20 minutes"

- id: pharmacies-monaco
  question: "List the pharmacies in Monaco."
  tier: 1
  download_is_legitimate: false
  target_type: place
  place: "Monaco"
  notes: "Ideal: places --in Monaco --category pharmacy. Tests stderr hygiene — --in Monaco warns region-vs-country."
  failures:
    - id: silent-wrong-place-resolution
      proposal: 15
      target: cli
      evidence: matched
      title: "Warn when a place qualifier contradicts the resolved country or region"

- id: motorways-rhode-island
  question: "What are the major highways running through Rhode Island?"
  tier: 1
  download_is_legitimate: false
  target_type: segment
  place: "Rhode Island, US"
  notes: "Ideal: roads --in 'Rhode Island, US' --class motorway. download -t segment is a failure."
  failures:
    - id: class-lists-advertise-subtype-values
      proposal: 14
      target: cli
      evidence: matched
      title: "Correct the `--class` value lists, which advertise `subtype` values that return zero"

