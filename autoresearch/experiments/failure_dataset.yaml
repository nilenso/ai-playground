- id: asian-restaurants-rollup
  question: "How many Asian restaurants are in Cambridge, Massachusetts?"
  tier: 2
  download_is_legitimate: false
  target_type: place
  place: "Cambridge, MA"
  notes: >
    Ideal: categories -t place --in 'Cambridge, MA' --top 400, then count --where
    'categories.primary in [asian_restaurant,chinese_restaurant,japanese_restaurant,…]'.
    asian_restaurant alone undercounts ~10x — only leaf categories are stored.
  failures:
    - id: where-crashes-on-list-fields
      proposal: 4
      target: cli
      evidence: matched
      title: "Teach `--where` list membership instead of crashing with a raw PyArrow traceback"
    - id: taxonomy-tree-not-queryable
      proposal: 6
      target: cli
      evidence: recorded
      title: "Make the place taxonomy tree queryable, and document `basic_category`"
    - id: categories-has-no-search
      proposal: 11
      target: cli
      evidence: matched
      title: "Add `categories --search` so discovery does not depend on guessing `--top N`"
    - id: categories-top-n-truncates-silently
      proposal: 16
      target: hint
      evidence: recorded
      title: "Tell the user when `categories --top N` truncated the list"

