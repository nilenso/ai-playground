# Agent-usability eval question bank.
# Fields:
#   id                     stable slug (no '__' — that delimits run dirs)
#   question               the prompt handed verbatim to `claude -p`
#   tier                   1..5 complexity tier
#   download_is_legitimate true only when no convenience verb covers the type
#   target_type            expected Overture type(s) for the answer
#   place                  optional; resolved by the cost guard to bound query size
#   notes                  ideal path (and, for compound, the expected decomposition)
#   subtasks               optional; expected verb-by-verb decomposition (compound)

# ---------------------------------------------------------------------------
# Tier 2 — one type, but the filter requires knowing something about the
# schema that the model cannot guess.
# ---------------------------------------------------------------------------

- id: asian-restaurants-rollup-vancouver
  question: "How many Asian restaurants are in Vancouver, British Columbia?"
  tier: 2
  download_is_legitimate: false
  target_type: place
  place: "Vancouver, BC, CA"
  notes: "Ideal: count -t place --in 'Vancouver, British Columbia' --where 'categories.primary=asian_restaurant'"

- id: starbucks-brand-seattle
  question: "Find every Starbucks location in Seattle."
  tier: 2
  download_is_legitimate: false
  target_type: place
  place: "Seattle, WA, US"
  notes: "Ideal: places --in Seattle --where 'names.primary=Starbucks'"

- id: high-confidence-places-malta
  question: "Give me only the high-confidence places in Malta."
  tier: 2
  download_is_legitimate: false
  target_type: place
  place: "Malta"
  notes: "Ideal: places --in Malta --where 'confidence>0.95'"

- id: address-points-luxembourg
  question: "Where is bagmane tech park in bengaluru?"
  tier: 2
  download_is_legitimate: false
  target_type: address
  place: "Luxembourg"
  notes: "Ideal: address -t place --in 'bengaluru,KA' --where 'names.primary=bagmane tech park'"
