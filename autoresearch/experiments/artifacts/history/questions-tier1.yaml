# Agent-usability eval question bank.
# Fields:
#   id                     stable slug (no '__' — that delimits run dirs)
#   question               the prompt handed verbatim to `claude -p`
#   tier                   1..5 complexity tier
#   download_is_legitimate true only when no convenience verb covers the type
#   target_type            expected Overture type(s) for the answer
#   place                  optional; resolved by the cost guard to bound query size
#   notes                  ideal path (and, for compound, the expected decomposition)
#   subtasks               optional; expected verb-by-verb decomposition (compound)

# ---------------------------------------------------------------------------
# Tier 1 — single type, single area, one verb. Baseline: if these fail,
# nothing downstream is measuring what you think it is.
# ---------------------------------------------------------------------------

- id: hospitals-count-rhode-island
  question: "How many hospitals are there in Rhode Island?"
  tier: 1
  download_is_legitimate: false
  target_type: place
  place: "Rhode Island, US"
  notes: "Ideal: count -t place --in 'Rhode Island' --where 'categories.primary=hospital'"

- id: cafes-cambridge-ma
  question: "List the coffee shops in Cambridge, Massachusetts."
  tier: 1
  download_is_legitimate: false
  target_type: place
  place: "Cambridge, MA, US"
  notes: "Ideal: count -t place --in 'Cambridge, MA' --where 'categories.primary=coffee_shop'"

- id: buildings-monaco
  question: "Get all the building footprints for Monaco."
  tier: 1
  download_is_legitimate: false
  target_type: building
  place: "Monaco"
  notes: "Ideal: count -t building --in 'Monaco'"

- id: point-query-rome
  question: "What is at latitude 41.8973, longitude 12.4763?"
  tier: 1
  download_is_legitimate: false
  target_type: [place, building]
  notes: "Ideal: at 41.8973,12.4763 -t place"

- id: schema-introspection-places
  question: "What fields are available on Overture place features in the current release?"
  tier: 1
  download_is_legitimate: false
  target_type: place
  notes: "Ideal: schema -t place"
