# Agent-usability eval question bank.
# Fields:
#   id                     stable slug (no '__' — that delimits run dirs)
#   question               the prompt handed verbatim to `claude -p`
#   tier                   1..5 complexity tier
#   download_is_legitimate true only when no convenience verb covers the type
#   target_type            expected Overture type(s) for the answer
#   place                  optional; resolved by the cost guard to bound query size
#   notes                  ideal path (and, for compound, the expected decomposition)
#   subtasks               optional; expected verb-by-verb decomposition (compound)


# ---------------------------------------------------------------------------
# Tier 5 — compound. Multi-theme, multi-step, and the decomposition itself
# is the thing under test.
# ---------------------------------------------------------------------------

- id: grocery-access-gap-providence
  question: "Identify the neighbourhoods in Providence, RI that are furthest from any grocery store."
  tier: 5
  download_is_legitimate: false
  target_type: [place, division_area, segment]
  place: "Providence, RI, US"
  subtasks:
    - get division_area --area "Providence, RI"
    - count + get places --category grocery_store --area <bbox buffered>
    - compute distance from each division_area centroid to nearest store
    - rank and report
  notes: >
    Grocery stores just outside the city boundary still serve residents, so the
    places bbox must be buffered beyond the division. Agent should state the
    distance metric (straight-line vs network) rather than leaving it implicit.

- id: ev-charging-coverage-corridor
  question: "Assess EV charging coverage along the motorway corridor in Slovenia."
  tier: 5
  download_is_legitimate: false
  target_type: [place, segment, infrastructure]
  place: "Slovenia"
  subtasks:
    - get segments --class motorway --area Slovenia
    - get places --category ev_charging_station --area Slovenia
    - buffer segments, spatial join
    - compute gap distances along the corridor
  notes: >
    Cross-theme with a buffer step. Charging data completeness is poor in
    places; a strong answer caveats coverage rather than presenting gap
    distances as ground truth about the road network.

- id: walkability-audit-ljubljana
  question: "Do an audit of walkability in central Ljubljana using Overture data."
  tier: 5
  download_is_legitimate: false
  target_type: [segment, connector, place, building]
  place: "Ljubljana, SI"
  subtasks:
    - clarify or state a working definition of walkability
    - get segments --class footway,path,pedestrian
    - get places for amenity density
    - get buildings for footprint density
    - aggregate to a grid or division_area
  notes: >
    Deliberately underspecified. Ideal path either asks one scoping question or
    states an explicit definition before fetching. Failure mode: downloading
    four themes for the whole city and then deciding what the question meant.

- id: bulk-landcover-malta
  question: "Export the complete land cover dataset for Malta as GeoParquet."
  tier: 5
  download_is_legitimate: true
  target_type: land_cover
  place: "Malta"
  notes: >
    No convenience verb covers land_cover — raw download bounded by bbox is the
    correct tool here. This case exists to keep the eval from teaching that
    download is always wrong; penalising it here would be a false positive.

- id: bulk-building-parts-rotterdam
  question: "I need the raw building_part records for Rotterdam for a 3D model."
  tier: 5
  download_is_legitimate: true
  target_type: building_part
  place: "Rotterdam, NL"
  notes: >
    Same shape as the land_cover case, plus a stated downstream use that rules
    out any lossy convenience output. Agent should still count or size-estimate
    before fetching, and should not convert to GeoJSON when GeoParquet was the
    implied requirement.
